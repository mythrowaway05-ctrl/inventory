<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:     #2d6a4f;
      --green-lt:  #d8f3dc;
      --green-mid: #52b788;
      --amber:     #b5451b;
      --gray-50:   #f8f7f4;
      --gray-100:  #eeece7;
      --gray-300:  #c5c2b8;
      --gray-500:  #7a7769;
      --gray-800:  #2c2b27;
      --white:     #ffffff;
      --mono:      'DM Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    body { font-family: var(--sans); background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

    header {
      background: var(--green);
      color: var(--white);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--green-mid);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 { font-size: 1.9rem; font-weight: 500; letter-spacing: -0.01em; }

    .refresh-info { text-align: right; font-size: 1rem; opacity: 0.95; font-family: var(--mono); line-height: 1.8; }

    .toolbar {
      padding: 0.75rem 2rem;
      background: var(--white);
      border-bottom: 1px solid var(--gray-300);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .search-wrap { position: relative; flex: 1; max-width: 360px; }
    .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--gray-300); pointer-events: none; }

    input[type="search"] {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.1rem;
      font-family: var(--sans);
      font-size: 0.875rem;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      background: var(--gray-50);
      color: var(--gray-800);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="search"]:focus { border-color: var(--green-mid); }

    .count-badge { font-size: 0.8rem; font-family: var(--mono); color: var(--gray-500); white-space: nowrap; }

    .table-wrap { padding: 1.5rem 2rem 3rem; overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--gray-300);
    }

    thead { background: var(--gray-50); border-bottom: 2px solid var(--gray-300); }

    th {
      padding: 0.75rem 0.875rem;
      text-align: left;
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray-500);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-right: 1px solid var(--gray-300);
    }
    th:last-child { border-right: none; }
    th:hover { color: var(--green); }
    th .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.3; font-size: 0.65rem; }
    th.sorted .sort-arrow { opacity: 1; color: var(--green); }

    td {
      padding: 0.65rem 0.875rem;
      border-bottom: 1px solid var(--gray-300);
      border-right: 1px solid var(--gray-300);
      vertical-align: middle;
      color: var(--gray-800);
    }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-50); }

    .col-qty  { width: 90px;  text-align: right; }
    .col-item { width: 110px; }
    .col-desc { min-width: 200px; }
    .col-uom  { width: 70px; }
    .col-pack { width: 130px; }
    .col-feat { width: 120px; }
    .col-wt   { width: 100px; text-align: right; }

    .qty-num { font-family: var(--mono); font-size: 0.9rem; font-weight: 500; color: var(--green); }
    .qty-low { color: var(--amber); }

    .item-no { font-family: var(--mono); font-size: 0.8rem; color: var(--gray-500); }

    .badge-free {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      background: var(--green-lt);
      color: var(--green);
      border-radius: 4px;
      padding: 2px 7px;
    }

    .dash { color: var(--gray-300); }

    .badge-new {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 6px;
      vertical-align: middle;
      letter-spacing: 0.03em;
    }

    .state-msg { padding: 4rem 2rem; text-align: center; color: var(--gray-500); font-size: 0.95rem; }

    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2px solid var(--gray-100);
      border-top-color: var(--green-mid);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .new-section { margin: 1.25rem 2rem 0; }
    .new-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .new-title { font-size: 0.95rem; font-weight: 500; color: var(--gray-800); display: flex; align-items: center; gap: 8px; }
    .new-count { font-size: 0.75rem; background: #E6F1FB; color: #185FA5; border: 1px solid #85B7EB; border-radius: 20px; padding: 2px 10px; font-weight: 500; }
    .collapse-btn { font-size: 0.75rem; color: var(--gray-500); background: none; border: 1px solid var(--gray-300); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-family: var(--sans); }
    .new-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .new-card { border-radius: 8px; padding: 0.75rem 1rem; }
    .age-0 { background: #E6F1FB; border: 1px solid #378ADD; }
    .age-1 { background: #EDF5FC; border: 1px solid #85B7EB; }
    .age-2 { background: #F4F9FE; border: 1px solid #B5D4F4; }
    .age-3 { background: #F9FCFE; border: 1px solid #d0e6f7; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .card-desc { font-size: 0.875rem; font-weight: 500; color: var(--gray-800); }
    .card-time { font-size: 0.7rem; color: var(--gray-500); font-family: var(--mono); white-space: nowrap; margin-left: 8px; }
    .card-detail { font-size: 0.75rem; color: var(--gray-500); display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
    .card-qty { font-family: var(--mono); font-weight: 500; color: var(--green); }
    .age-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; margin-top: 5px; }
    .dot-0 { background: #378ADD; }
    .dot-1 { background: #85B7EB; }
    .dot-2 { background: #B5D4F4; }
    .dot-3 { background: #d0e6f7; }
    .legend { display: flex; gap: 16px; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--gray-500); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .new-empty { font-size: 0.875rem; color: var(--gray-500); padding: 1rem 0; }
    tr.is-new-0 td:first-child { border-left: 3px solid #378ADD; }
    tr.is-new-0 td { background: #E6F1FB; }
    tr.is-new-0:hover td { background: #dceefa; }
    tr.is-new-1 td:first-child { border-left: 3px solid #85B7EB; }
    tr.is-new-1 td { background: #EDF5FC; }
    tr.is-new-1:hover td { background: #e3f0fb; }
    tr.is-new-2 td:first-child { border-left: 3px solid #B5D4F4; }
    tr.is-new-2 td { background: #F4F9FE; }
    tr.is-new-2:hover td { background: #ebf4fd; }
    tr.is-new-3 td:first-child { border-left: 3px solid #d0e6f7; }
    tr.is-new-3 td { background: #F9FCFE; }
    tr.is-new-3:hover td { background: #f0f8fe; }
    .new-divider { border: none; border-top: 1px solid var(--gray-300); margin: 1.25rem 2rem 0; }
    .all-label { padding: 0.75rem 2rem 0.25rem; font-size: 0.72rem; color: var(--gray-500); font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }


    /* ── Cart button ── */
    #cart-btn {
      position: relative;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: #fff;
      padding: 7px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #cart-btn:hover { background: rgba(255,255,255,0.25); }

    .cart-count {
      position: absolute;
      top: -6px; right: -6px;
      background: var(--amber);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      font-family: var(--mono);
      border-radius: 10px;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center;
      line-height: 16px;
    }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      backdrop-filter: blur(2px);
    }
    #overlay.visible { display: block; }

    /* ── PIN Modal ── */
    #pin-modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 14px;
      padding: 2rem;
      z-index: 300;
      width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }
    #pin-modal.visible { display: block; }
    #pin-modal h2 { font-size: 1.1rem; font-weight: 600; color: var(--gray-800); margin-bottom: 0.35rem; }
    #pin-modal p  { font-size: 0.82rem; color: var(--gray-500); margin-bottom: 1.25rem; }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gray-300);
      background: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .pin-dot.filled { background: var(--green); border-color: var(--green); }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pin-key {
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--gray-300);
      background: var(--gray-50);
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--mono);
      color: var(--gray-800);
      transition: background 0.1s;
    }
    .pin-key:hover  { background: var(--gray-100); }
    .pin-key:active { background: var(--gray-300); }
    .pin-key.clear  { font-size: 0.8rem; color: var(--gray-500); }
    .pin-error { color: var(--amber); font-size: 0.8rem; margin-top: 0.5rem; min-height: 1.2em; }

    /* ── Order Drawer ── */
    #order-drawer {
      position: fixed;
      top: 0; right: 0;
      width: min(480px, 100vw);
      height: 100vh;
      background: #fff;
      z-index: 300;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 30px rgba(0,0,0,0.15);
    }
    #order-drawer.open { transform: translateX(0); }

    .drawer-header {
      background: var(--green);
      color: #fff;
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .drawer-header h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; }
    .drawer-subtitle   { font-size: 0.78rem; opacity: 0.85; font-family: var(--mono); }
    .drawer-deadline   { font-size: 0.75rem; margin-top: 4px; opacity: 0.8; }

    .drawer-close {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .drawer-close:hover { background: rgba(255,255,255,0.25); }

    .drawer-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--gray-100);
      border-bottom: 1px solid var(--gray-300);
      flex-shrink: 0;
    }
    .drawer-stat {
      background: #fff;
      padding: 0.75rem 1rem;
    }
    .drawer-stat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray-500); margin-bottom: 2px; }
    .drawer-stat-value { font-size: 1.1rem; font-weight: 600; font-family: var(--mono); color: var(--green); }

    .drawer-body {
      overflow-y: auto;
      flex: 1;
      padding: 0;
    }

    .drawer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .drawer-table thead th {
      background: var(--gray-50);
      padding: 0.5rem 0.75rem;
      text-align: left;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-500);
      font-weight: 500;
      border-bottom: 1px solid var(--gray-300);
      position: sticky;
      top: 0;
      white-space: nowrap;
    }
    .drawer-table tbody td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--gray-100);
      vertical-align: middle;
    }
    .drawer-table tbody tr:last-child td { border-bottom: none; }
    .drawer-table tbody tr:hover td { background: var(--gray-50); }

    .dt-item   { font-family: var(--mono); font-size: 0.72rem; color: var(--gray-500); white-space: nowrap; }
    .dt-desc   { font-weight: 500; color: var(--gray-800); }
    .dt-qty    { text-align: right; font-family: var(--mono); font-weight: 600; color: var(--green); white-space: nowrap; }
    .dt-qty-mismatch { color: var(--amber); }
    .dt-handle {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .dt-ref    { background: #dbeafe; color: #1d4ed8; }
    .dt-frozen { background: #e0f2fe; color: #0369a1; }
    .dt-dry    { background: var(--gray-100); color: var(--gray-500); }

    .drawer-empty {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--gray-500);
      font-size: 0.875rem;
    }
    .drawer-lock-msg {
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .drawer-lock-msg svg { color: var(--gray-300); margin-bottom: 0.75rem; }
    .drawer-lock-msg p { font-size: 0.875rem; color: var(--gray-500); }

    @media (max-width: 768px) {
      /* ── Header ── */
      header { padding: 0.875rem 1rem; }
      header h1 { font-size: 1.3rem; }
      .refresh-info { text-align: left; font-size: 0.8rem; }
      #cart-btn { padding: 9px 11px; }

      /* ── Toolbar ── */
      .toolbar { padding: 0.75rem 1rem; flex-wrap: wrap; }
      .search-wrap { max-width: 100%; flex: 1 1 100%; }
      input[type="search"] { font-size: 1rem; padding: 0.6rem 0.75rem 0.6rem 2.2rem; }
      .count-badge { font-size: 0.85rem; }

      /* ── Inventory table ── */
      .table-wrap { padding: 0.75rem 0 2rem; }
      table { font-size: 0.8rem; border-radius: 0; border-left: none; border-right: none; }
      td, th { padding: 0.6rem 0.6rem; }
      .col-uom { display: none; }
      .col-desc { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
      .col-desc.expanded { white-space: normal; overflow: visible; text-overflow: unset; max-width: none; }
      .qty-num { font-size: 0.95rem; }
      .badge-new { font-size: 0.6rem; padding: 1px 5px; }
      .badge-free { font-size: 0.65rem; }

      /* ── PIN modal — slides up from bottom on mobile ── */
      #pin-modal {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        transform: none;
        border-radius: 18px 18px 0 0;
        padding: 1.5rem 1.5rem 2.5rem;
      }
      .pin-key { padding: 18px; font-size: 1.25rem; }
      .pin-pad { gap: 10px; }
      .pin-dot { width: 16px; height: 16px; }

      /* ── Order drawer — full screen on phone ── */
      #order-drawer { width: 100vw; border-radius: 0; }
      .drawer-header { padding: 1rem; }
      .drawer-table { font-size: 0.75rem; }
      .drawer-table thead th,
      .drawer-table tbody td { padding: 0.5rem 0.6rem; }
      .drawer-col-pack { display: none; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      /* ── Tablet — drawer takes ~60% width ── */
      #order-drawer { width: 60vw; }
    }
  </style>
</head>
<body>

<header>
  <h1>Available Inventory</h1>
  <div style="display:flex;align-items:center;gap:1.25rem;">
    <div class="refresh-info">
      <div id="updated-at">Loading...</div>
      <div id="countdown-display" style="font-size: 0.8rem; opacity: 0.7; margin-top: 2px;"></div>
    </div>
    <button id="cart-btn" title="View current order" aria-label="View current order">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span id="cart-item-count" class="cart-count" style="display:none;"></span>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="search" placeholder="Search items..." aria-label="Search inventory" />
  </div>
  <span class="count-badge" id="count-badge"></span>
</div>

<div class="new-section" id="new-section"></div>
<hr class="new-divider" id="new-divider" style="display:none;">
<div class="all-label" id="all-label" style="display:none;"></div>
<div class="table-wrap" id="table-wrap">
  <div class="state-msg"><div class="spinner"></div><br>Loading inventory...</div>
</div>

<script>
  const REFRESH_MS = 60 * 60 * 1000;
  const DATA_FILE  = "inventory.json";

  let allItems = [];
  let sortCol  = "Description";
  let sortDir  = 1;
  let searchVal = "";
  let reloadInterval;
  let lastScrapedIso = null;

  function renderNewItems(items) {
    const newItems = items.filter(item => item.new_since);
    const section = document.getElementById("new-section");
    const divider = document.getElementById("new-divider");
    const allLabel = document.getElementById("all-label");

    if (newItems.length === 0) {
      section.innerHTML = `<div class="new-header"><div class="new-title">New items <span class="new-count">0 in last 24 hrs</span></div></div><div class="new-empty">Nothing new yet — check back later!</div>`;
      divider.style.display = "block";
      allLabel.style.display = "block";
      allLabel.textContent = "All items (" + items.length + ")";
      return;
    }

    const now = Date.now();
    function getAge(iso) {
      const hrs = (now - new Date(iso).getTime()) / 3600000;
      if (hrs < 2) return { cls: "age-0", dot: "dot-0", label: Math.round(hrs * 60) + " min ago" };
      if (hrs < 6) return { cls: "age-1", dot: "dot-1", label: Math.round(hrs) + " hrs ago" };
      if (hrs < 12) return { cls: "age-2", dot: "dot-2", label: Math.round(hrs) + " hrs ago" };
      return { cls: "age-3", dot: "dot-3", label: Math.round(hrs) + " hrs ago" };
    }

    let collapsed = false;

    function render() {
      const cards = newItems.map(item => {
        const age = getAge(item.new_since);
        return `<div class="new-card ${age.cls}">
          <div class="card-top">
            <div style="display:flex;align-items:flex-start;gap:6px">
              <span class="age-dot ${age.dot}"></span>
              <span class="card-desc">${item["Description"] || ""}</span>
            </div>
            <span class="card-time">${age.label}</span>
          </div>
          <div class="card-detail">
            <span>${item["Item No."] || ""}</span>
            <span>${item["Pack Size"] || ""}</span>
            <span class="card-qty">${item["Available Qty."] || "0"} avail.</span>
          </div>
        </div>`;
      }).join("");

      section.innerHTML = `
        <div class="new-header">
          <div class="new-title">
            ✦ New items
            <span class="new-count">${newItems.length} added in the last 24 hrs</span>
          </div>
          <button class="collapse-btn" id="collapse-btn">${collapsed ? "Expand" : "Collapse"}</button>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:#378ADD"></span>Under 2 hours</span>
          <span class="legend-item"><span class="legend-dot" style="background:#85B7EB"></span>2–6 hours</span>
          <span class="legend-item"><span class="legend-dot" style="background:#B5D4F4"></span>6–12 hours</span>
          <span class="legend-item"><span class="legend-dot" style="background:#d0e6f7"></span>12–24 hours</span>
        </div>
        ${collapsed ? "" : `<div class="new-grid">${cards}</div>`}
      `;

      document.getElementById("collapse-btn").addEventListener("click", () => {
        collapsed = !collapsed;
        render();
      });
    }

    render();
    divider.style.display = "block";
    allLabel.style.display = "block";
    allLabel.textContent = "All items (" + items.length + ")";
  }

  async function loadData() {
    try {
      const res  = await fetch(DATA_FILE + "?t=" + Date.now());
      const data = await res.json();
      allItems   = data.items || [];
      document.getElementById("updated-at").textContent = "Last updated: " + (data.updated_at || "unknown");
      renderNewItems(allItems);
      render();
      scheduleReload(data.updated_at_iso);
    } catch (e) {
      document.getElementById("table-wrap").innerHTML =
        `<div class="state-msg">Could not load inventory.json. Make sure the scraper has run and the file is in the same folder.</div>`;
    }
  }

  function render() {
    const query = searchVal.toLowerCase();
    const filtered = allItems.filter(item =>
      !query ||
      (item["Description"] || "").toLowerCase().includes(query) ||
      (item["Item No."]    || "").toLowerCase().includes(query) ||
      (item["UOM"]         || "").toLowerCase().includes(query) ||
      (item["Pack Size"]   || "").toLowerCase().includes(query)
    );

    filtered.sort((a, b) => {
      let av = a[sortCol] || "", bv = b[sortCol] || "";
      const an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sortDir;
      return av.localeCompare(bv) * sortDir;
    });

    document.getElementById("count-badge").textContent = filtered.length + " of " + allItems.length + " items";

    if (filtered.length === 0) {
      document.getElementById("table-wrap").innerHTML = `<div class="state-msg">No items match your search.</div>`;
      return;
    }

    const cols = [
      { key: "Available Qty.", label: "Avail. Qty",   cls: "col-qty"  },
      { key: "Item No.",       label: "Item No.",      cls: "col-item" },
      { key: "Description",    label: "Description",   cls: "col-desc" },
      { key: "UOM",            label: "UOM",           cls: "col-uom"  },
      { key: "Pack Size",      label: "Pack Size",     cls: "col-pack" },
      { key: "Feature Type",   label: "Feature",       cls: "col-feat" },
      { key: "Gross Weight",   label: "Gross Wt (lb)", cls: "col-wt"   },
    ];

    const arrow = c => {
      const active = sortCol === c.key;
      return `<span class="sort-arrow">${active ? (sortDir === 1 ? "▲" : "▼") : "▲"}</span>`;
    };

    const thead = `<thead><tr>${cols.map(c =>
      `<th class="${c.cls}${sortCol === c.key ? " sorted" : ""}" data-col="${c.key}">${c.label}${arrow(c)}</th>`
    ).join("")}</tr></thead>`;

    const tbody = `<tbody>${filtered.map(item => {
      const qty      = parseFloat(item["Available Qty."]) || 0;
      const qtyClass = qty <= 3 ? "qty-num qty-low" : "qty-num";
      const feat     = (item["Feature Type"] || "").trim();
      const featHtml = feat ? `<span class="badge-free">${feat}</span>` : `<span class="dash">—</span>`;
      const isNew = item["new_since"] && ((Date.now() - new Date(item["new_since"]).getTime()) < 24 * 60 * 60 * 1000);
      const newBadge = isNew ? `<span class="badge-new">New</span>` : "";
      let newRowClass = "";
      if (isNew) {
        const hrs = (Date.now() - new Date(item["new_since"]).getTime()) / 3600000;
        if (hrs < 2) newRowClass = "is-new-0";
        else if (hrs < 6) newRowClass = "is-new-1";
        else if (hrs < 12) newRowClass = "is-new-2";
        else newRowClass = "is-new-3";
      }
      return `<tr class="${newRowClass}">
        <td class="col-qty"><span class="${qtyClass}">${qty}</span></td>
        <td class="col-item"><span class="item-no">${item["Item No."] || ""}</span></td>
        <td class="col-desc">${item["Description"] || ""}${newBadge}</td>
        <td class="col-uom">${item["UOM"] || ""}</td>
        <td class="col-pack">${item["Pack Size"] || ""}</td>
        <td class="col-feat">${featHtml}</td>
        <td class="col-wt">${item["Gross Weight"] || "—"}</td>
      </tr>`;
    }).join("")}</tbody>`;

    document.getElementById("table-wrap").innerHTML = `<table>${thead}${tbody}</table>`;

    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir *= -1;
        else { sortCol = col; sortDir = 1; }
        render();
      });
    });

    document.querySelectorAll("td.col-desc").forEach(td => {
      td.addEventListener("click", () => {
        td.classList.toggle("expanded");
      });
    });
  }

  function scheduleReload(updatedAt) {
    clearInterval(reloadInterval);
    reloadInterval = setInterval(loadData, REFRESH_MS);
    startCountdown(updatedAt);
  }

  function startCountdown(isoTimestamp) {
    clearInterval(window._countdownInterval);
    const lastRun = isoTimestamp ? new Date(isoTimestamp) : new Date();
    window._countdownInterval = setInterval(() => {
      const elapsed = Date.now() - lastRun.getTime();
      const remaining = Math.max(REFRESH_MS - (elapsed % REFRESH_MS), 0);
      const m = Math.floor(remaining / 60000);
      const s = Math.floor((remaining % 60000) / 1000).toString().padStart(2, "0");
      document.getElementById("countdown-display").textContent = "Next update in " + m + ":" + s;
    }, 1000);
  }

  document.getElementById("search").addEventListener("input", e => {
    searchVal = e.target.value;
    render();
  });


<!-- ── Overlay ── -->
<div id="overlay"></div>

<!-- ── PIN Modal ── -->
<div id="pin-modal" role="dialog" aria-modal="true" aria-label="Enter PIN">
  <h2>🔒 Current Order</h2>
  <p>Enter your PIN to view this week's order</p>
  <div class="pin-dots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-key" data-digit="1">1</button>
    <button class="pin-key" data-digit="2">2</button>
    <button class="pin-key" data-digit="3">3</button>
    <button class="pin-key" data-digit="4">4</button>
    <button class="pin-key" data-digit="5">5</button>
    <button class="pin-key" data-digit="6">6</button>
    <button class="pin-key" data-digit="7">7</button>
    <button class="pin-key" data-digit="8">8</button>
    <button class="pin-key" data-digit="9">9</button>
    <button class="pin-key clear" data-action="clear">Clear</button>
    <button class="pin-key" data-digit="0">0</button>
    <button class="pin-key clear" data-action="back">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<!-- ── Order Drawer ── -->
<div id="order-drawer" role="dialog" aria-modal="true" aria-label="Current order">
  <div class="drawer-header">
    <div>
      <h2>Current Order</h2>
      <div class="drawer-subtitle" id="drawer-po"></div>
      <div class="drawer-deadline" id="drawer-deadline"></div>
    </div>
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-summary" id="drawer-summary"></div>
  <div class="drawer-body" id="drawer-body">
    <div class="drawer-empty">Loading order…</div>
  </div>
</div>

<script>
  // ── PIN & Order Drawer ────────────────────────────────────────────────────
  const CORRECT_HASH  = "78e370b587b145920213731b7c7c725e512b3b6577c51c800218a7c764c532ae";
  const SESSION_KEY   = "order_unlocked";
  const ORDER_FILE    = "order.json";

  let pinEntry    = "";
  let orderData   = null;
  let orderLoaded = false;

  const overlay     = document.getElementById("overlay");
  const pinModal    = document.getElementById("pin-modal");
  const pinError    = document.getElementById("pin-error");
  const orderDrawer = document.getElementById("order-drawer");
  const cartBtn     = document.getElementById("cart-btn");
  const cartCount   = document.getElementById("cart-item-count");

  // ── Deadline: Saturday of current week at 11:59 PM ───────────────────────
  function getOrderDeadline() {
    const now = new Date();
    const day = now.getDay(); // 0=Sun, 6=Sat
    const daysUntilSat = (6 - day + 7) % 7 || 7; // always go to next/current Sat
    const sat = new Date(now);
    sat.setDate(now.getDate() + (day === 6 ? 0 : daysUntilSat));
    sat.setHours(23, 59, 0, 0);
    return sat;
  }

  function formatDeadline(dt) {
    const opts = { weekday: "long", month: "long", day: "numeric" };
    return "Open until " + dt.toLocaleDateString(undefined, opts) + " at 11:59 PM";
  }

  function isOrderOpen() {
    return new Date() < getOrderDeadline();
  }

  // ── Load order.json once ──────────────────────────────────────────────────
  async function loadOrder() {
    if (orderLoaded) return;
    try {
      const res = await fetch(ORDER_FILE + "?t=" + Date.now());
      orderData = await res.json();
      orderLoaded = true;
      // Update cart badge
      const count = (orderData.items || []).length;
      if (count > 0) {
        cartCount.textContent = count;
        cartCount.style.display = "block";
      }
    } catch (e) {
      orderData = null;
    }
  }

  // ── Open flow ─────────────────────────────────────────────────────────────
  cartBtn.addEventListener("click", async () => {
    await loadOrder();
    const unlocked = sessionStorage.getItem(SESSION_KEY) === "1";
    if (unlocked) {
      openDrawer();
    } else {
      openPin();
    }
  });

  function openPin() {
    pinEntry = "";
    updateDots();
    pinError.textContent = "";
    overlay.classList.add("visible");
    pinModal.classList.add("visible");
  }

  function closePin() {
    pinModal.classList.remove("visible");
    overlay.classList.remove("visible");
  }

  function openDrawer() {
    renderDrawer();
    overlay.classList.add("visible");
    orderDrawer.classList.add("open");
  }

  function closeDrawer() {
    orderDrawer.classList.remove("open");
    overlay.classList.remove("visible");
  }

  overlay.addEventListener("click", () => {
    closePin();
    closeDrawer();
  });

  document.getElementById("drawer-close").addEventListener("click", closeDrawer);

  // ── PIN logic ─────────────────────────────────────────────────────────────
  function updateDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById("pd" + i).classList.toggle("filled", i < pinEntry.length);
    }
  }

  document.querySelectorAll(".pin-key").forEach(btn => {
    btn.addEventListener("click", () => {
      const digit  = btn.dataset.digit;
      const action = btn.dataset.action;
      pinError.textContent = "";

      if (digit !== undefined && pinEntry.length < 4) {
        pinEntry += digit;
        updateDots();
        if (pinEntry.length === 4) checkPin();
      } else if (action === "back") {
        pinEntry = pinEntry.slice(0, -1);
        updateDots();
      } else if (action === "clear") {
        pinEntry = "";
        updateDots();
      }
    });
  });

  // Also allow keyboard input on PIN modal
  document.addEventListener("keydown", e => {
    if (!pinModal.classList.contains("visible")) return;
    if (e.key >= "0" && e.key <= "9" && pinEntry.length < 4) {
      pinEntry += e.key;
      updateDots();
      if (pinEntry.length === 4) checkPin();
    } else if (e.key === "Backspace") {
      pinEntry = pinEntry.slice(0, -1);
      updateDots();
    } else if (e.key === "Escape") {
      closePin();
    }
  });

  async function checkPin() {
    const msgBuffer  = new TextEncoder().encode(pinEntry);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashHex    = Array.from(new Uint8Array(hashBuffer))
                         .map(b => b.toString(16).padStart(2, "0")).join("");
    if (hashHex === CORRECT_HASH) {
      sessionStorage.setItem(SESSION_KEY, "1");
      closePin();
      setTimeout(openDrawer, 150);
    } else {
      pinError.textContent = "Incorrect PIN. Try again.";
      // Shake the dots
      const dots = document.querySelectorAll(".pin-dot");
      dots.forEach(d => { d.style.borderColor = "var(--amber)"; d.style.background = "var(--amber-lt, #fde8d8)"; });
      setTimeout(() => {
        pinEntry = "";
        updateDots();
        dots.forEach(d => { d.style.borderColor = ""; d.style.background = ""; });
      }, 700);
    }
  }

  // ── Render drawer ─────────────────────────────────────────────────────────
  function renderDrawer() {
    const deadline = getOrderDeadline();
    document.getElementById("drawer-deadline").textContent = formatDeadline(deadline);

    if (!orderData || !orderData.items) {
      document.getElementById("drawer-po").textContent = "";
      document.getElementById("drawer-summary").innerHTML = "";
      document.getElementById("drawer-body").innerHTML =
        `<div class="drawer-empty">Could not load order data.<br>Run the scraper first.</div>`;
      return;
    }

    // PO number + pickup date
    const appt = orderData.appointment || {};
    document.getElementById("drawer-po").textContent =
      orderData.po_number ? "PO " + orderData.po_number : "";

    // Summary stats
    const sum = orderData.summary || {};
    const items = orderData.items || [];
    const statsHtml = [
      ["Line Items",   sum["Total Line Items"] || items.length],
      ["Gross Weight", sum["Gross Weight"]     || "—"],
      ["Pickup",       appt.pickup_date        || "—"],
      ["Cube Size",    sum["Total Cube Size"]  || "—"],
    ].map(([label, val]) => `
      <div class="drawer-stat">
        <div class="drawer-stat-label">${label}</div>
        <div class="drawer-stat-value">${val}</div>
      </div>`).join("");
    document.getElementById("drawer-summary").innerHTML = statsHtml;

    // Items table
    if (items.length === 0) {
      document.getElementById("drawer-body").innerHTML =
        `<div class="drawer-empty">No items in this order.</div>`;
      return;
    }

    const rows = items.map(item => {
      const ordQty  = item["Order Qty."]    || item["Order\nQty."]    || "—";
      const accQty  = item["Accepted Qty."] || item["Accepted\nQty."] || "—";
      const mismatch = ordQty !== "—" && accQty !== "—" && ordQty !== accQty;
      const handling = (item["Handling Requirements"] || "").trim().toUpperCase();
      let badgeCls = "dt-dry";
      if (handling === "REF")    badgeCls = "dt-ref";
      if (handling === "FROZEN") badgeCls = "dt-frozen";

      return `<tr>
        <td class="dt-item">${item["Item No."] || "—"}</td>
        <td class="dt-desc">${item["Description"] || "—"}</td>
        <td class="dt-qty ${mismatch ? "dt-qty-mismatch" : ""}">${ordQty}${mismatch ? ` <span style="opacity:.6;font-size:.7rem">(acc: ${accQty})</span>` : ""}</td>
        <td class="drawer-col-pack">${item["Pack Size"] || "—"}</td>
        <td>${handling ? `<span class="dt-handle ${badgeCls}">${handling}</span>` : "—"}</td>
      </tr>`;
    }).join("");

    document.getElementById("drawer-body").innerHTML = `
      <table class="drawer-table">
        <thead>
          <tr>
            <th>Item No.</th>
            <th>Description</th>
            <th style="text-align:right">Qty</th>
            <th class="drawer-col-pack">Pack Size</th>
            <th>Storage</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // Pre-load order data in background so badge populates
  loadOrder();
</script>

</body>
</html>
