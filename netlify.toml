# Netlify cache configuration
# JSON files update hourly — cache for 1 hour, allow stale for 30 min while revalidating
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=1800"

# HTML files — cache for 5 minutes so updates show up quickly after a push
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"
