[build]
  publish = "."

[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = false
[build.processing.js]
  bundle = false
  minify = false
[build.processing.html]
  pretty_urls = false

# JSON — cache 5 minutes, must revalidate after expiry
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# HTML — cache 5 minutes
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
