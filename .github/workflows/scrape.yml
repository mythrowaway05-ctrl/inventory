name: Scrape Inventory

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:       # Allow manual runs from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        env:
          AE_USERNAME: ${{ secrets.AE_USERNAME }}
          AE_PASSWORD: ${{ secrets.AE_PASSWORD }}
          AE_PROGRAM_CODE: ${{ secrets.AE_PROGRAM_CODE }}
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f inventory.json order.json previous_items.json last_pushed_order.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "update inventory and order"
          git push
